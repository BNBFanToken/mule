<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOOF 代币部署工具</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080c;--panel:#101018;--panel2:#16161f;--border:#1e1e2e;
  --amber:#e8a849;--amber-dim:#b8842e;--green:#3ecf8e;--red:#ef4444;
  --text:#d4d4d8;--text2:#71717a;--text3:#3f3f46;
  --mono:'JetBrains Mono',monospace;--sans:'Noto Sans SC',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--panel)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.5px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
.header-right{display:flex;align-items:center;gap:16px}
.net-badge{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:4px;background:#1a1a2e;border:1px solid var(--border);color:var(--text2)}
.conn-btn{font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid var(--amber-dim);background:transparent;color:var(--amber);cursor:pointer;transition:all .2s}
.conn-btn:hover{background:rgba(232,168,73,.1)}
.conn-btn.connected{border-color:var(--green);color:var(--green)}
.main{display:grid;grid-template-columns:1fr 380px;overflow:hidden}
.editor-panel{display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.editor-tabs{display:flex;align-items:center;padding:0 16px;height:40px;background:var(--panel);border-bottom:1px solid var(--border);gap:8px}
.editor-tab{font-family:var(--mono);font-size:12px;color:var(--text2);padding:4px 12px;border-radius:4px;background:var(--panel2);border:1px solid var(--border)}
.editor-tab.active{color:var(--amber);border-color:var(--amber-dim)}
.editor-wrap{flex:1;position:relative;overflow:hidden}
#code{width:100%;height:100%;background:var(--bg);color:#c9d1d9;border:none;outline:none;resize:none;padding:16px 20px;font-family:var(--mono);font-size:13px;line-height:1.7;tab-size:4;white-space:pre;overflow:auto}
#code::placeholder{color:var(--text3)}
.editor-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-top:1px solid var(--border);font-family:var(--mono);font-size:11px;color:var(--text3)}
.right-panel{display:flex;flex-direction:column;overflow-y:auto;background:var(--panel)}
.section{padding:20px;border-bottom:1px solid var(--border)}
.section-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:14px}
.info-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.info-label{color:var(--text2)}
.info-value{font-family:var(--mono);color:var(--text);font-weight:500}
.btn{width:100%;padding:10px;border:none;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--amber);color:#08080c}
.btn-primary:hover{background:#f0b85a;transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,168,73,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.log{font-family:var(--mono);font-size:11px;line-height:1.8;max-height:260px;overflow-y:auto;padding:12px;background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.log-line{display:flex;gap:8px}
.log-time{color:var(--text3);flex-shrink:0}
.log-msg{color:var(--text2);word-break:break-all}
.log-msg.success{color:var(--green)}
.log-msg.error{color:var(--red)}
.log-msg.info{color:var(--amber)}
.result-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px}
.result-label{color:var(--text2)}
.result-value{font-family:var(--mono);color:var(--text);word-break:break-all;text-align:right;max-width:200px}
.result-value a{color:var(--amber);text-decoration:none}
.result-value a:hover{text-decoration:underline}
.spinner{width:14px;height:14px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
@media(max-width:900px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .right-panel{max-height:50vh}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><span class="logo-dot"></span>WOOF Deploy</div>
    <div class="header-right">
      <span class="net-badge" id="netName">未连接</span>
      <button class="conn-btn" id="connBtn" onclick="connectWallet()">连接 MetaMask</button>
    </div>
  </div>
  <div class="main">
    <div class="editor-panel">
      <div class="editor-tabs">
        <span class="editor-tab active">Token.sol</span>
      </div>
      <div class="editor-wrap">
        <textarea id="code" spellcheck="false" readonly placeholder="// 合约源代码（只读）"></textarea>
      </div>
      <div class="editor-footer">
        <span id="charCount">0 字符</span>
        <span>Solidity</span>
      </div>
    </div>
    <div class="right-panel">
      <div class="section">
        <div class="section-title">合约信息</div>
        <div class="info-card">
          <div class="info-row"><span class="info-label">代币名称</span><span class="info-value">Woof</span></div>
          <div class="info-row"><span class="info-label">代币符号</span><span class="info-value">WOOF</span></div>
          <div class="info-row"><span class="info-label">精度</span><span class="info-value">18</span></div>
          <div class="info-row"><span class="info-label">总供应量</span><span class="info-value">1,000,000,000</span></div>
          <div class="info-row"><span class="info-label">编译器</span><span class="info-value">v0.8.19</span></div>
          <div class="info-row"><span class="info-label">优化</span><span class="info-value">200 runs</span></div>
        </div>
      </div>
      <div class="section">
        <button class="btn btn-primary" id="deployBtn" onclick="deployContract()">
          部署合约
        </button>
      </div>
      <div class="section" id="resultSection" style="display:none">
        <div class="section-title">部署结果</div>
        <div class="result-card" id="resultCard"></div>
      </div>
      <div class="section" style="flex:1">
        <div class="section-title">日志</div>
        <div class="log" id="logBox"></div>
      </div>
    </div>
  </div>
</div>
<script>
const BYTECODE = '608060405234801561001057600080fd5b50600180546001600160a01b031916339081179091556b033b2e3c9fd0803ce80000006000818155828152600260205260408082208390555190917fddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef9161007991815260200190565b60405180910390a3610c20806100906000396000f3fe608060405234801561001057600080fd5b50600436106100ea5760003560e01c8063715018a61161008c578063a457c2d711610066578063a457c2d714610223578063a9059cbb14610236578063dd62ed3e14610249578063f2fde38b1461028257600080fd5b8063715018a6146101cb5780638da5cb5b146101d557806395d89b411461020057600080fd5b806323b872dd116100c857806323b872dd14610162578063313ce56714610175578063395093511461018f57806370a08231146101a257600080fd5b806306fdde03146100ef578063095ea7b31461012857806318160ddd1461014b575b600080fd5b610112604051806040016040528060048152602001632bb7b7b360e11b81525081565b60405161011f91906109be565b60405180910390f35b61013b610136366004610a28565b610295565b604051901515815260200161011f565b61015460005481565b60405190815260200161011f565b61013b610170366004610a52565b61032c565b61017d601281565b60405160ff909116815260200161011f565b61013b61019d366004610a28565b61054e565b6101546101b0366004610a8e565b6001600160a01b031660009081526002602052604090205490565b6101d3610605565b005b6001546101e8906001600160a01b031681565b6040516001600160a01b03909116815260200161011f565b610112604051806040016040528060048152602001632ba7a7a360e11b81525081565b61013b610231366004610a28565b6106a9565b61013b610244366004610a28565b6107c1565b610154610257366004610ab0565b6001600160a01b03918216600090815260036020908152604080832093909416825291909152205490565b6101d3610290366004610a8e565b6108a6565b60006001600160a01b0383166102c65760405162461bcd60e51b81526004016102bd90610ae3565b60405180910390fd5b3360008181526003602090815260408083206001600160a01b03881680855290835292819020869055518581529192917f8c5be1e5ebec7d5bd14f71427d1e84f3dd0314c0f7b2291e5b200ac8c7c3b92591015b60405180910390a35060015b92915050565b60006001600160a01b0384166103925760405162461bcd60e51b8152602060048201 5260800190565b60208082526023908201527f546f6b656e3a207472616e7366657220746f20746865207a65726f206164647260408201526265737360e81b606082015260800190565b60208082526026908201527f546f6b656e3a207472616e7366657220616d6f756e7420657863656564732062604082015265616c616e636560d01b606082015260800190565b634e487b7160e01b600052601160045260246000fd5b8181038181111561032657610326610bae565b8082018082111561032657610326610bae565bfea2646970667358221220c422e2a9c528df235d4f21659dbda7ee7ba23337f2d702e2b53f310ebb2e6ceb64736f6c63430008130033';

let currentAccount = null;
let currentChainId = null;

const codeEl = document.getElementById('code');
const logBox = document.getElementById('logBox');
const deployBtn = document.getElementById('deployBtn');
const resultSection = document.getElementById('resultSection');

codeEl.value = `// SPDX-License-Identifier: MIT
pragma solidity ^0.8.19;

contract Token {
    string public constant name = "Woof";
    string public constant symbol = "WOOF";
    uint8 public constant decimals = 18;
    uint256 public totalSupply;
    address public owner;

    mapping(address => uint256) private _balances;
    mapping(address => mapping(address => uint256)) private _allowances;

    event Transfer(address indexed from, address indexed to, uint256 value);
    event Approval(address indexed owner, address indexed spender, uint256 value);
    event OwnershipTransferred(address indexed previousOwner, address indexed newOwner);

    modifier onlyOwner() {
        require(msg.sender == owner, "Token: caller is not the owner");
        _;
    }

    constructor() {
        owner = msg.sender;
        totalSupply = 1_000_000_000 * 10 ** 18;
        _balances[msg.sender] = totalSupply;
        emit Transfer(address(0), msg.sender, totalSupply);
    }

    // ... 完整代码已省略
}`;
document.getElementById('charCount').textContent = codeEl.value.length + ' 字符';

function log(msg, type = '') {
  const now = new Date();
  const time = now.toTimeString().slice(0, 8);
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${time}</span><span class="log-msg ${type}">${msg}</span>`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

async function connectWallet() {
  if (typeof window.ethereum === 'undefined') {
    log('未检测到 MetaMask，请先安装', 'error');
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    currentAccount = accounts[0];
    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
    currentChainId = parseInt(chainId, 16);

    const btn = document.getElementById('connBtn');
    btn.classList.add('connected');
    btn.textContent = currentAccount.slice(0, 6) + '...' + currentAccount.slice(-4);

    const netNames = {1:'以太坊主网',11155111:'Sepolia 测试网',5:'Goerli 测试网',17000:'Holesky 测试网',56:'BSC 主网',137:'Polygon 主网',42161:'Arbitrum One',10:'Optimism',8453:'Base',43114:'Avalanche C-Chain',250:'Fantom',324:'zkSync Era'};
    document.getElementById('netName').textContent = netNames[currentChainId] || `Chain ${currentChainId}`;

    log(`已连接: ${currentAccount}`, 'success');

    window.ethereum.on('accountsChanged', (accs) => {
      if (accs.length > 0) {
        currentAccount = accs[0];
        btn.textContent = currentAccount.slice(0, 6) + '...' + currentAccount.slice(-4);
        log('账户已切换: ' + currentAccount, 'info');
      }
    });
    window.ethereum.on('chainChanged', () => window.location.reload());
  } catch (e) {
    log('连接失败: ' + e.message, 'error');
  }
}

async function deployContract() {
  if (!currentAccount) { log('请先连接钱包', 'error'); return; }

  const deployData = '0x' + BYTECODE;

  deployBtn.disabled = true;
  deployBtn.innerHTML = '<span class="spinner"></span>部署中...';
  log('正在部署 Token (WOOF)...', 'info');

  try {
    const balance = await window.ethereum.request({
      method: 'eth_getBalance',
      params: [currentAccount, 'latest']
    });
    const ethBalance = Number(BigInt(balance)) / 1e18;
    log(`当前余额: ${ethBalance.toFixed(6)} ETH`, '');

    const gasEstimate = await window.ethereum.request({
      method: 'eth_estimateGas',
      params: [{ from: currentAccount, data: deployData }]
    });
    const gasBigInt = BigInt(gasEstimate);
    const gasLimit = Number(gasBigInt * 120n / 100n);
    log(`预估 Gas: ${gasBigInt}`, '');

    const txHash = await window.ethereum.request({
      method: 'eth_sendTransaction',
      params: [{
        from: currentAccount,
        data: deployData,
        gas: '0x' + BigInt(gasLimit).toString(16)
      }]
    });
    log(`交易已发送: ${txHash}`, 'info');
    log('等待区块确认...', '');

    const receipt = await waitForReceipt(txHash);
    const gasUsed = Number(BigInt(receipt.gasUsed));
    const blockNum = Number(BigInt(receipt.blockNumber));

    if (receipt.status === '0x0' || receipt.contractAddress === null) {
      log('交易已上链但执行失败', 'error');
      log(`区块高度: ${blockNum}，消耗 Gas: ${gasUsed}`, '');
      throw new Error('部署失败，交易已回滚');
    }

    const contractAddr = receipt.contractAddress;
    log(`部署成功!`, 'success');
    log(`合约地址: ${contractAddr}`, 'success');
    log(`消耗 Gas: ${gasUsed}`, '');
    log(`区块高度: ${blockNum}`, '');

    const explorers = {
      1: 'https://etherscan.io',
      11155111: 'https://sepolia.etherscan.io',
      17000: 'https://holesky.etherscan.io',
      56: 'https://bscscan.com',
      137: 'https://polygonscan.com',
      42161: 'https://arbiscan.io',
      10: 'https://optimistic.etherscan.io',
      8453: 'https://basescan.org',
      43114: 'https://snowtrace.io',
      250: 'https://ftmscan.com',
      8217: 'https://scope.klaytn.com',
      324: 'https://explorer.zksync.io'
    };
    const explorerBase = explorers[currentChainId] || 'https://etherscan.io';

    resultSection.style.display = 'block';
    document.getElementById('resultCard').innerHTML = `
      <div class="result-row"><span class="result-label">合约名称</span><span class="result-value">Token</span></div>
      <div class="result-row"><span class="result-label">合约地址</span><span class="result-value"><a href="${explorerBase}/address/${contractAddr}" target="_blank">${contractAddr}</a></span></div>
      <div class="result-row"><span class="result-label">交易哈希</span><span class="result-value"><a href="${explorerBase}/tx/${txHash}" target="_blank">${txHash}</a></span></div>
      <div class="result-row"><span class="result-label">区块高度</span><span class="result-value">${blockNum}</span></div>
      <div class="result-row"><span class="result-label">Gas 消耗</span><span class="result-value">${gasUsed}</span></div>
      <div class="result-row"><span class="result-label">部署者</span><span class="result-value"><a href="${explorerBase}/address/${currentAccount}" target="_blank">${currentAccount}</a></span></div>
    `;
  } catch (e) {
    log('部署失败: ' + (e.message || e), 'error');
  } finally {
    deployBtn.disabled = false;
    deployBtn.innerHTML = '部署合约';
  }
}

function waitForReceipt(txHash) {
  return new Promise((resolve, reject) => {
    const check = async () => {
      try {
        const receipt = await window.ethereum.request({
          method: 'eth_getTransactionReceipt',
          params: [txHash]
        });
        if (receipt) { resolve(receipt); return; }
      } catch (e) {}
      setTimeout(check, 3000);
    };
    check();
    setTimeout(() => reject(new Error('等待超时')), 300000);
  });
}

log('WOOF 部署工具已就绪', 'info');
log('连接 MetaMask 后点击部署按钮即可', '');
</script>
