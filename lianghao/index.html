<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERC20 合约部署 · 靓号地址生成器</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold-50: #FFFBEB;
  --gold-100: #FEF3C7;
  --gold-200: #FDE68A;
  --gold-300: #FCD34D;
  --gold-400: #FBBF24;
  --gold-500: #F59E0B;
  --gold-600: #D97706;
  --gold-700: #B45309;
  --amber-glow: rgba(251, 191, 36, 0.15);
  --bg: #FFFEF9;
  --bg-card: #FFFFFF;
  --text-primary: #1C1917;
  --text-secondary: #57534E;
  --text-muted: #A8A29E;
  --border: #E7E5E4;
  --border-gold: rgba(251, 191, 36, 0.3);
  --success: #059669;
  --success-bg: #ECFDF5;
  --error: #DC2626;
  --error-bg: #FEF2F2;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow-sm: 0 1px 3px rgba(28,25,23,0.04), 0 1px 2px rgba(28,25,23,0.03);
  --shadow-md: 0 4px 16px rgba(28,25,23,0.06), 0 2px 4px rgba(28,25,23,0.03);
  --shadow-lg: 0 12px 40px rgba(28,25,23,0.08), 0 4px 12px rgba(28,25,23,0.04);
  --shadow-gold: 0 8px 32px rgba(251,191,36,0.15), 0 2px 8px rgba(251,191,36,0.1);
}

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(251,191,36,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(253,224,71,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(245,158,11,0.03) 0%, transparent 70%);
  animation: bgShift 20s ease-in-out infinite alternate;
  z-index: 0;
  pointer-events: none;
}

@keyframes bgShift {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-2%, -2%) rotate(3deg); }
}

.noise-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  position: relative;
  z-index: 2;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeUp 0.8s ease-out;
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--gold-50), var(--gold-100));
  border: 1px solid var(--border-gold);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 500;
  color: var(--gold-700);
  margin-bottom: 20px;
  letter-spacing: 0.5px;
}

.header-badge svg {
  width: 14px; height: 14px;
}

.header h1 {
  font-size: 36px;
  font-weight: 900;
  line-height: 1.2;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--gold-700) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header p {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto;
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
  animation: fadeUp 0.8s ease-out both;
}

.card:nth-child(2) { animation-delay: 0.1s; }
.card:nth-child(3) { animation-delay: 0.2s; }
.card:nth-child(4) { animation-delay: 0.3s; }

.card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border-gold);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.card-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.card-icon.gold {
  background: linear-gradient(135deg, var(--gold-100), var(--gold-200));
  color: var(--gold-700);
}

.card-icon.green {
  background: linear-gradient(135deg, #ECFDF5, #D1FAE5);
  color: var(--success);
}

.card-icon.blue {
  background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
  color: #2563EB;
}

.card-icon svg { width: 20px; height: 20px; }

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Connect Button */
.btn-connect {
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
  color: #fff;
  box-shadow: var(--shadow-gold);
  position: relative;
  overflow: hidden;
}

.btn-connect::before {
  content: '';
  position: absolute;
  top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}

.btn-connect:hover::before { left: 100%; }
.btn-connect:hover { transform: translateY(-1px); box-shadow: 0 12px 40px rgba(251,191,36,0.25); }
.btn-connect:active { transform: translateY(0); }

.btn-connect:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn-connect svg { width: 20px; height: 20px; }

/* Wallet Info */
.wallet-info {
  display: none;
  animation: fadeIn 0.4s ease-out;
}

.wallet-info.show { display: block; }

.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.info-row:last-child { border-bottom: none; }

.info-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}

.info-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.info-value .addr {
  color: var(--gold-700);
  background: var(--gold-50);
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  font-size: 12px;
}

/* Nonce Input */
.nonce-section { display: none; }
.nonce-section.show { display: block; }

.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.input-wrapper {
  flex: 1;
  position: relative;
}

.input-wrapper input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--text-primary);
  background: var(--bg);
  transition: all 0.2s ease;
  outline: none;
}

.input-wrapper input:focus {
  border-color: var(--gold-400);
  box-shadow: 0 0 0 3px var(--amber-glow);
}

.input-wrapper input::placeholder {
  color: var(--text-muted);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
}

.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
  color: #fff;
  box-shadow: var(--shadow-gold);
}

.btn-primary:hover { transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

.btn-secondary {
  background: var(--bg);
  color: var(--text-primary);
  border: 1.5px solid var(--border);
}

.btn-secondary:hover { border-color: var(--gold-400); background: var(--gold-50); }

/* Target Suffix */
.target-section {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 14px 16px;
  background: linear-gradient(135deg, var(--gold-50), #FFF);
  border: 1px solid var(--border-gold);
  border-radius: var(--radius-sm);
}

.target-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}

.target-input {
  flex: 1;
  padding: 8px 12px;
  border: 1.5px solid var(--border-gold);
  border-radius: var(--radius-xs);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--gold-700);
  background: #fff;
  text-align: center;
  outline: none;
  letter-spacing: 2px;
  transition: all 0.2s ease;
}

.target-input:focus {
  border-color: var(--gold-400);
  box-shadow: 0 0 0 3px var(--amber-glow);
}

/* Progress */
.progress-section { display: none; }
.progress-section.show { display: block; }

.progress-bar-wrap {
  width: 100%;
  height: 6px;
  background: var(--gold-100);
  border-radius: 100px;
  overflow: hidden;
  margin-bottom: 12px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-400), var(--gold-500));
  border-radius: 100px;
  width: 0%;
  transition: width 0.15s ease;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

/* Result */
.result-section { display: none; }
.result-section.show { display: block; animation: fadeIn 0.5s ease-out; }

.result-box {
  background: linear-gradient(135deg, var(--gold-50), #FFF);
  border: 2px solid var(--gold-300);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.result-box::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(251,191,36,0.06) 0%, transparent 70%);
  animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 1; }
}

.result-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--gold-600);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  position: relative;
}

.result-address {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.6;
  position: relative;
  cursor: pointer;
  padding: 12px;
  border-radius: var(--radius-xs);
  transition: background 0.2s ease;
}

.result-address:hover { background: rgba(251,191,36,0.08); }

.result-address .highlight {
  color: var(--gold-600);
  font-weight: 700;
  text-shadow: 0 0 8px rgba(251,191,36,0.3);
}

.result-meta {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-top: 16px;
  position: relative;
}

.result-meta-item {
  font-size: 12px;
  color: var(--text-secondary);
}

.result-meta-item span {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  color: var(--gold-700);
}

.btn-copy {
  margin-top: 16px;
  padding: 10px 24px;
  background: #fff;
  border: 1.5px solid var(--gold-300);
  border-radius: var(--radius-sm);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-700);
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
}

.btn-copy:hover { background: var(--gold-50); border-color: var(--gold-400); }

/* Status Messages */
.status-msg {
  display: none;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  margin-top: 12px;
  animation: fadeIn 0.3s ease-out;
}

.status-msg.show { display: flex; align-items: center; gap: 8px; }
.status-msg.success { background: var(--success-bg); color: var(--success); }
.status-msg.error { background: var(--error-bg); color: var(--error); }

/* Spinner */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--gold-200);
  border-top-color: var(--gold-500);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text-primary);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  z-index: 999;
  transition: transform 0.3s ease;
  box-shadow: var(--shadow-lg);
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 640px) {
  .container { padding: 24px 16px 40px; }
  .header h1 { font-size: 28px; }
  .card { padding: 20px; }
  .input-group { flex-direction: column; }
  .result-address { font-size: 13px; }
}
</style>
</head>
<body>
<div class="noise-overlay"></div>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      ERC-20 合约部署工具
    </div>
    <h1>靓号合约地址生成器</h1>
    <p>连接钱包，自动计算合约地址，找到以 <strong>88888888</strong> 结尾的吉利地址</p>
  </div>

  <!-- Card 1: Connect Wallet -->
  <div class="card" id="card-connect">
    <div class="card-header">
      <div class="card-icon gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="14" r="2"/></svg>
      </div>
      <div>
        <div class="card-title">连接钱包</div>
        <div class="card-subtitle">支持 MetaMask 及所有 WalletConnect 钱包</div>
      </div>
    </div>

    <button class="btn-connect" id="btn-connect" onclick="connectWallet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/></svg>
      连接钱包
    </button>

    <div class="wallet-info" id="wallet-info">
      <div class="info-row">
        <span class="info-label">钱包地址</span>
        <span class="info-value"><span class="addr" id="wallet-address">-</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">当前 Nonce</span>
        <span class="info-value" id="wallet-nonce">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">所在网络</span>
        <span class="info-value" id="wallet-network">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">ETH 余额</span>
        <span class="info-value" id="wallet-balance">-</span>
      </div>
    </div>

    <div class="status-msg" id="connect-status"></div>
  </div>

  <!-- Card 2: Search Config -->
  <div class="card nonce-section" id="card-search">
    <div class="card-header">
      <div class="card-icon blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div>
        <div class="card-title">地址搜索</div>
        <div class="card-subtitle">配置目标后缀并搜索匹配的 Nonce</div>
      </div>
    </div>

    <div class="target-section">
      <span class="target-label">目标后缀</span>
      <input class="target-input" id="target-suffix" value="88888888" maxlength="40" placeholder="88888888">
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" id="nonce-start" placeholder="起始 Nonce（默认当前值）" pattern="[0-9]*" inputmode="numeric">
      </div>
      <div class="input-wrapper">
        <input type="text" id="nonce-range" placeholder="搜索范围（默认10万）" pattern="[0-9]*" inputmode="numeric" value="100000">
      </div>
    </div>

    <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px;line-height:1.6;">
      <strong>提示：</strong>每多一位后缀，搜索难度增加 16 倍。4 位后缀约需 ~6.5 万次，8 位后缀约需 ~43 亿次。建议先用短后缀测试。
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="btn-search" onclick="startSearch()" style="flex:1;min-width:140px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        单线程搜索
      </button>
      <button class="btn btn-primary" id="btn-search-parallel" onclick="startSearchParallel()" style="flex:1;min-width:140px;background:linear-gradient(135deg,#7C3AED,#A855F7);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M14 12h4"/></svg>
        多线程搜索
      </button>
      <button class="btn btn-secondary" id="btn-stop" onclick="stopSearch()" disabled>
        停止
      </button>
    </div>

    <div id="parallel-status" style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center;"></div>

    <!-- Progress -->
    <div class="progress-section" id="progress-section">
      <div style="height:12px;"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-stats">
        <span id="progress-current">已搜索: 0</span>
        <span id="progress-speed">速度: 0/s</span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <div class="status-msg" id="search-status"></div>
  </div>

  <!-- Card 3: Result -->
  <div class="card result-section" id="card-result">
    <div class="card-header">
      <div class="card-icon green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div>
        <div class="card-title">找到靓号地址</div>
        <div class="card-subtitle">恭喜！发现匹配的合约地址</div>
      </div>
    </div>

    <div class="result-box">
      <div class="result-label">合约部署地址</div>
      <div class="result-address" id="result-address" onclick="copyAddress()" title="点击复制">-</div>
      <div class="result-meta">
        <div class="result-meta-item">Nonce: <span id="result-nonce">-</span></div>
        <div class="result-meta-item">匹配后缀: <span id="result-suffix">-</span></div>
      </div>
      <button class="btn-copy" onclick="copyAddress()">复制地址</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
let userAddress = null;
let currentNonce = null;
let searching = false;
let workers = [];

// === Wallet Connection ===
async function connectWallet() {
  const btn = document.getElementById('btn-connect');

  if (!window.ethereum) {
    showStatus('connect-status', 'error', '未检测到钱包插件，请先安装 MetaMask');
    return;
  }

  try {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 连接中...';

    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    userAddress = await provider.getSigner().getAddress();

    const network = await provider.getNetwork();
    const nonce = await provider.getTransactionCount(userAddress, 'pending');
    const balance = await provider.getBalance(userAddress);
    currentNonce = nonce;

    // Display info
    document.getElementById('wallet-address').textContent =
      userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
    document.getElementById('wallet-nonce').textContent = nonce;
    document.getElementById('wallet-network').textContent = network.name + ' (Chain ' + network.chainId + ')';
    document.getElementById('wallet-balance').textContent =
      parseFloat(ethers.utils.formatEther(balance)).toFixed(4) + ' ETH';

    document.getElementById('wallet-info').classList.add('show');
    document.getElementById('nonce-start').placeholder = '起始 Nonce（当前: ' + nonce + '）';
    document.getElementById('nonce-start').value = nonce;
    document.getElementById('card-search').classList.add('show');

    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 已连接';
    btn.style.background = 'linear-gradient(135deg, #059669, #10B981)';

    showStatus('connect-status', 'success', '钱包连接成功');

    // Listen for account/network changes (if supported)
    if (window.ethereum.on) {
      window.ethereum.on('accountsChanged', () => location.reload());
      window.ethereum.on('chainChanged', () => location.reload());
    }

  } catch (err) {
    console.error(err);
    showStatus('connect-status', 'error', '连接失败: ' + (err.message || '用户拒绝连接'));
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/></svg> 连接钱包';
  }
}

// Fast contract address calculation for bulk searching
// deployerBytes should be pre-computed via ethers.utils.arrayify(deployer)
function getContractAddressFast(deployerBytes, nonce) {
  // Encode nonce in RLP
  let nonceRlp;
  if (nonce === 0) {
    nonceRlp = [0x80]; // Empty string
  } else if (nonce <= 0x7f) {
    nonceRlp = [nonce]; // Single byte
  } else {
    // Manual hex→bytes conversion for performance
    const hex = nonce.toString(16);
    const paddedHex = hex.length % 2 === 0 ? hex : '0' + hex;
    const bytes = [];
    for (let i = 0; i < paddedHex.length; i += 2) {
      bytes.push(parseInt(paddedHex.substring(i, i + 2), 16));
    }
    nonceRlp = [0x80 + bytes.length - 1, ...bytes];
  }

  // Calculate total payload length
  const payloadLength = 1 + 20 + nonceRlp.length; // 0x94 prefix + 20 bytes address + nonce

  // Build RLP encoded data
  let rlpData;
  if (payloadLength < 56) {
    rlpData = [0xc0 + payloadLength, 0x94, ...deployerBytes, ...nonceRlp];
  } else {
    const lenHex = payloadLength.toString(16);
    const paddedLenHex = lenHex.length % 2 === 0 ? lenHex : '0' + lenHex;
    const lenBytes = [];
    for (let i = 0; i < paddedLenHex.length; i += 2) {
      lenBytes.push(parseInt(paddedLenHex.substring(i, i + 2), 16));
    }
    rlpData = [0xf7 + lenBytes.length, ...lenBytes, 0x94, ...deployerBytes, ...nonceRlp];
  }

  const hash = ethers.utils.keccak256(new Uint8Array(rlpData));
  return ethers.utils.getAddress('0x' + hash.slice(-40));
}

// === Vanity Search ===
async function startSearch() {
  if (!userAddress) {
    showStatus('search-status', 'error', '请先连接钱包');
    return;
  }

  const suffixRaw = document.getElementById('target-suffix').value.trim();
  const suffix = suffixRaw.toLowerCase();
  if (!suffix || !/^[0-9a-f]+$/.test(suffix)) {
    showStatus('search-status', 'error', '请输入有效的十六进制后缀（仅支持 0-9, a-f）');
    return;
  }

  const startNonceStr = document.getElementById('nonce-start').value.trim();
  const startNonce = startNonceStr ? parseInt(startNonceStr, 10) : currentNonce;
  const rangeStr = document.getElementById('nonce-range').value.trim();
  const range = rangeStr ? parseInt(rangeStr, 10) : 100000;

  if (isNaN(startNonce) || startNonce < 0) {
    showStatus('search-status', 'error', '起始 Nonce 格式不正确');
    return;
  }
  if (isNaN(range) || range <= 0) {
    showStatus('search-status', 'error', '搜索范围格式不正确');
    return;
  }
  if (startNonce + range > Number.MAX_SAFE_INTEGER) {
    showStatus('search-status', 'error', '搜索范围超出安全整数限制，请减小起始值或范围');
    return;
  }

  searching = true;
  document.getElementById('btn-search').disabled = true;
  document.getElementById('btn-search-parallel').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('progress-section').classList.add('show');
  document.getElementById('card-result').classList.remove('show');
  showStatus('search-status', 'success', '正在搜索...');

  // Pre-compute deployer bytes for performance
  const deployerBytes = Array.from(ethers.utils.arrayify(userAddress));
  const startTime = performance.now();
  let found = false;
  let batchSize = 500;
  let searched = 0;

  for (let i = startNonce; i < startNonce + range && searching; i += batchSize) {
    const end = Math.min(i + batchSize, startNonce + range);

    for (let n = i; n < end; n++) {
      const addr = getContractAddressFast(deployerBytes, n);
      if (addr.toLowerCase().endsWith(suffix)) {
        found = true;
        searched = n - startNonce + 1;
        displayResult(addr, n, suffix);
        break;
      }
    }

    if (found) break;

    searched = end - startNonce;
    const elapsed = (performance.now() - startTime) / 1000;
    const speed = Math.round(searched / elapsed);
    const percent = ((searched / range) * 100).toFixed(1);

    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('progress-current').textContent = '已搜索: ' + searched.toLocaleString();
    document.getElementById('progress-speed').textContent = '速度: ' + speed.toLocaleString() + '/s';
    document.getElementById('progress-percent').textContent = percent + '%';

    // Yield to UI
    await new Promise(r => setTimeout(r, 0));
  }

  searching = false;
  document.getElementById('btn-search').disabled = false;
  document.getElementById('btn-search-parallel').disabled = false;
  document.getElementById('btn-stop').disabled = true;

  if (!found) {
    showStatus('search-status', 'error', '搜索完毕，未找到匹配地址。请增大搜索范围或更换起始 Nonce。');
  } else {
    showStatus('search-status', 'success', '搜索成功！');
  }
}

function displayResult(address, nonce, suffix) {
  const addrEl = document.getElementById('result-address');
  const suffixLen = suffix.length;
  const prefix = address.slice(0, -suffixLen);
  // Show matched suffix in lowercase to match user input (ignore EIP-55 checksum case)
  const matched = address.slice(-suffixLen).toLowerCase();
  addrEl.innerHTML = prefix + '<span class="highlight">' + matched + '</span>';
  addrEl.dataset.address = address;

  document.getElementById('result-nonce').textContent = nonce;
  document.getElementById('result-suffix').textContent = suffix;
  document.getElementById('card-result').classList.add('show');

  // Scroll into view
  document.getElementById('card-result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// === Utilities ===
function copyAddress() {
  const addr = document.getElementById('result-address').dataset.address;
  if (!addr) return;
  navigator.clipboard.writeText(addr)
    .then(() => showToast('地址已复制到剪贴板'))
    .catch(() => showToast('复制失败，请手动复制'));
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'status-msg show ' + type;
  el.innerHTML = (type === 'success'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  ) + msg;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// === Web Worker Parallel Search ===
const workerScript = `
importScripts('https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js');

function getContractAddressFast(deployerBytes, nonce) {
  let nonceRlp;
  if (nonce === 0) {
    nonceRlp = [0x80];
  } else if (nonce <= 0x7f) {
    nonceRlp = [nonce];
  } else {
    const hex = nonce.toString(16);
    const paddedHex = hex.length % 2 === 0 ? hex : '0' + hex;
    const bytes = [];
    for (let i = 0; i < paddedHex.length; i += 2) {
      bytes.push(parseInt(paddedHex.substring(i, i + 2), 16));
    }
    nonceRlp = [0x80 + bytes.length - 1, ...bytes];
  }

  const payloadLength = 1 + 20 + nonceRlp.length;
  let rlpData;
  if (payloadLength < 56) {
    rlpData = [0xc0 + payloadLength, 0x94, ...deployerBytes, ...nonceRlp];
  } else {
    const lenHex = payloadLength.toString(16);
    const paddedLenHex = lenHex.length % 2 === 0 ? lenHex : '0' + lenHex;
    const lenBytes = [];
    for (let i = 0; i < paddedLenHex.length; i += 2) {
      lenBytes.push(parseInt(paddedLenHex.substring(i, i + 2), 16));
    }
    rlpData = [0xf7 + lenBytes.length, ...lenBytes, 0x94, ...deployerBytes, ...nonceRlp];
  }

  const hash = ethers.utils.keccak256(new Uint8Array(rlpData));
  return ethers.utils.getAddress('0x' + hash.slice(-40));
}

self.onmessage = function(e) {
  const { deployerBytes, startNonce, count, suffix } = e.data;
  
  for (let i = 0; i < count; i++) {
    const nonce = startNonce + i;
    const addr = getContractAddressFast(deployerBytes, nonce);
    if (addr.toLowerCase().endsWith(suffix)) {
      self.postMessage({ found: true, nonce: nonce, address: addr });
      return;
    }
  }
  
  self.postMessage({ found: false, searched: count });
};
`;

const workerBlob = new Blob([workerScript], { type: 'application/javascript' });
const workerUrl = URL.createObjectURL(workerBlob);

async function startSearchParallel() {
  if (!userAddress) {
    showStatus('search-status', 'error', '请先连接钱包');
    return;
  }

  const suffixRaw = document.getElementById('target-suffix').value.trim();
  const suffix = suffixRaw.toLowerCase();
  if (!suffix || !/^[0-9a-f]+$/.test(suffix)) {
    showStatus('search-status', 'error', '请输入有效的十六进制后缀（仅支持 0-9, a-f）');
    return;
  }

  const startNonceStr = document.getElementById('nonce-start').value.trim();
  const startNonce = startNonceStr ? parseInt(startNonceStr, 10) : currentNonce;
  const rangeStr = document.getElementById('nonce-range').value.trim();
  const range = rangeStr ? parseInt(rangeStr, 10) : 100000;

  if (isNaN(startNonce) || startNonce < 0 || isNaN(range) || range <= 0) {
    showStatus('search-status', 'error', '参数格式不正确');
    return;
  }

  const numWorkers = Math.min(navigator.hardwareConcurrency || 4, 8);
  document.getElementById('parallel-status').textContent = '使用 ' + numWorkers + ' 个线程并行搜索';

  searching = true;
  document.getElementById('btn-search').disabled = true;
  document.getElementById('btn-search-parallel').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('progress-section').classList.add('show');
  document.getElementById('card-result').classList.remove('show');
  showStatus('search-status', 'success', '多线程搜索中...');

  const deployerBytes = Array.from(ethers.utils.arrayify(userAddress));
  const startTime = performance.now();
  let found = false;
  let totalSearched = 0;
  const batchSize = 10000;

  // Create workers
  workers = [];
  for (let i = 0; i < numWorkers; i++) {
    const worker = new Worker(workerUrl);
    workers.push(worker);
  }

  let currentNonce = startNonce;
  const endNonce = startNonce + range;

  while (currentNonce < endNonce && searching) {
    const promises = [];
    
    // Distribute work to all workers
    for (let w = 0; w < workers.length && currentNonce < endNonce; w++) {
      const workerStart = currentNonce;
      const workerCount = Math.min(batchSize, endNonce - currentNonce);
      currentNonce += workerCount;

      promises.push(new Promise((resolve) => {
        workers[w].onmessage = (e) => {
          resolve(e.data);
        };
        workers[w].postMessage({
          deployerBytes: deployerBytes,
          startNonce: workerStart,
          count: workerCount,
          suffix: suffix
        });
      }));
    }

    // Wait for all workers to finish this batch
    const results = await Promise.all(promises);
    
    // Check results
    for (const result of results) {
      if (result.found) {
        found = true;
        displayResult(result.address, result.nonce, suffix);
        searching = false;
        break;
      }
      totalSearched += result.searched;
    }

    if (found) break;

    // Update progress
    const elapsed = (performance.now() - startTime) / 1000;
    const speed = Math.round(totalSearched / elapsed);
    const percent = ((totalSearched / range) * 100).toFixed(1);

    document.getElementById('progress-bar').style.width = percent + '%';
    document.getElementById('progress-current').textContent = '已搜索: ' + totalSearched.toLocaleString();
    document.getElementById('progress-speed').textContent = '速度: ' + speed.toLocaleString() + '/s';
    document.getElementById('progress-percent').textContent = percent + '%';

    await new Promise(r => setTimeout(r, 0));
  }

  // Clean up workers
  workers.forEach(w => w.terminate());
  workers = [];

  searching = false;
  document.getElementById('btn-search').disabled = false;
  document.getElementById('btn-search-parallel').disabled = false;
  document.getElementById('btn-stop').disabled = true;

  if (!found) {
    showStatus('search-status', 'error', '搜索完毕，未找到匹配地址。');
  } else {
    showStatus('search-status', 'success', '多线程搜索成功！');
  }
}

function stopSearch() {
  searching = false;
  workers.forEach(w => w.terminate());
  workers = [];
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-search').disabled = false;
  document.getElementById('btn-search-parallel').disabled = false;
  document.getElementById('progress-section').classList.remove('show');
  showStatus('search-status', 'error', '搜索已停止');
}
</script>
